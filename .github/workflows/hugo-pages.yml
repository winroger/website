name: Deploy Hugo Site to Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  HUGO_DESTINATION: dist

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Build with Hugo
        run: hugo --gc --minify --destination "$HUGO_DESTINATION"

      - name: Ensure index exists
        run: test -f "$HUGO_DESTINATION/index.html"

      - name: Add .nojekyll
        run: touch "$HUGO_DESTINATION/.nojekyll"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./${{ env.HUGO_DESTINATION }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
